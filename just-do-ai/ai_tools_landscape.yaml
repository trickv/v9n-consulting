title: AI Engineering Tools Landscape
subtitle: "Coding with AI Bootcamp — reference"

footer_note: |
  These categories aren't walls — tools are converging fast. The best AI-assisted developers reach for different tools at different moments.
  This bootcamp focuses on <strong style="color:#f0a0a0;">Claude Code</strong> because understanding the terminal agent paradigm gives you the deepest foundation. Everything else is a layer of abstraction on top.

star_legend:
  - label: Bootcamp primary tool
    style: gold
  - label: Covered in bootcamp
    style: gray

categories:

  - id: generators
    label: App Generators
    title: "Prompt → App"
    tagline: "Describe it, get a working app — batteries included"
    audience: "Rapid prototypes, MVPs, non-technical builders, PM demos"
    layout:
      grid_column: "1"
      grid_row: "1 / 4"
    colors:
      bg_gradient: ["#1a1520", "#161220"]
      border: "#2d2338"
      accent: ["#a855f7", "#7c3aed"]
      label: "#c084fc"
      card_bg: "#1f1828"
      card_hover_bg: "#251e30"
    tools:
      - name: Lovable
        url: https://lovable.dev/
        type: browser
        star: gray
        desc: "Full-stack React/TS apps from prompts. Best-in-class UI quality. Native Supabase integration. One-click deploy."
        highlight: "~$25/mo Pro · Credit-based · GitHub sync"
      - name: Google AI Studio
        url: https://aistudio.google.com/
        type: browser
        desc: 'Free Gemini 3 access. "Build" mode for vibe coding apps. One-click deploy. Text, image, audio & video models in one playground.'
        highlight: "Free tier · Google ecosystem · Gemini API keys"
      - name: Bolt
        url: https://bolt.new/
        type: browser
        desc: "By StackBlitz. Full Node.js in-browser via WebContainers. React/Vite output. Multiple AI model support."
        highlight: "Tiered pricing · Bolt Cloud / Netlify / Vercel deploy"
      - name: Replit
        url: https://replit.com/
        type: browser IDE
        desc: "Cloud IDE + Agent 4. Parallel agents, infinite canvas design, multiple artifacts. Auto-tests and auto-debugs. 50+ languages."
        highlight: "Credit-based · From $17/mo Core · Built-in DB, auth & hosting"
    more:
      - v0
      - Base44
      - Create.xyz
      - Hostinger Horizons
    more_urls:
      v0: https://v0.app/
      Base44: https://base44.com/
      Create.xyz: https://create.xyz/
      Hostinger Horizons: https://www.hostinger.com/horizons
    infra_note:
      label: Common infrastructure defaults
      text: >
        <strong>Supabase</strong> (Postgres DB, auth, storage) and <strong>Vercel</strong> (frontend deploy)
        show up as defaults in most app generators — but they're not AI-specific.
        Netlify, Cloudflare Pages, Fly.io, Firebase, or whatever you already use works just as well.

  - id: ide
    label: AI-Native Editors
    title: "IDE + Agent"
    tagline: "Your editor, supercharged with AI agents"
    audience: "Day-to-day dev work, refactoring, feature builds — and devs who still want hands on the keyboard"
    layout:
      grid_column: "2"
      grid_row: "3"
    colors:
      bg_gradient: ["#141a20", "#121820"]
      border: "#1e2d38"
      accent: ["#3b82f6", "#2563eb"]
      label: "#60a5fa"
      card_bg: "#182028"
      card_hover_bg: "#1c2630"
    tools:
      - name: Cursor
        url: https://cursor.com/
        type: desktop IDE
        desc: "VS Code fork rebuilt around AI. Indexes entire repos. Composer for multi-file edits. Background agents on branches. Multi-model."
        highlight: "~$20/mo Pro · Also in JetBrains via ACP"
      - name: GitHub Copilot
        url: https://github.com/features/copilot
        type: IDE plugin
        desc: "Most widely adopted. Agent mode for autonomous edits. Coding Agent assigns issues → PRs. MCP + multi-model support."
        highlight: "VS Code, JetBrains, Visual Studio, Xcode · Plan/Agent/Edit modes"
    more:
      - Windsurf
      - JetBrains AI
      - Zed AI
      - Trae
    more_urls:
      Windsurf: https://windsurf.com/
      JetBrains AI: https://www.jetbrains.com/ai/
      Zed AI: https://zed.dev/
      Trae: https://trae.ai/

  - id: terminal
    label: Agentic Coding
    title: "Agent-First"
    tagline: "Skip the editor — talk directly to the agent"
    audience: "Production codebases, deep refactoring, experienced engineers"
    badge:
      text: Bootcamp Focus
      style: primary
    layout:
      grid_column: "2"
      grid_row: "1 / 3"
    colors:
      bg_gradient: ["#141f1a", "#121a16"]
      border: "#1e382d"
      accent: ["#22c55e", "#16a34a"]
      label: "#4ade80"
      card_bg: "#182820"
      card_hover_bg: "#1c3028"
    tools:
      - name: Claude Code
        url: https://docs.anthropic.com/en/docs/claude-code
        type: CLI + App
        star: gold
        desc: "Anthropic's leading agent. Deep codebase understanding via large context. Git-aware. Skills/MCP extensible. Transparent operation."
        highlight: "Claude Sonnet/Opus · Configurable approval modes · Local-first"
      - name: Codex
        url: https://github.com/openai/codex
        type: CLI + App
        desc: "OpenAI's agent. Open-source, Rust-built. Multi-agent workflows (fork sub-tasks). Skills system. Cloud mode for async work. Desktop app + CLI + IDE."
        highlight: "GPT-5.x · Web search built in · Plugin/MCP ecosystem"
      - name: Gemini CLI
        url: https://github.com/google-gemini/gemini-cli
        type: CLI
        desc: "Google's terminal agent. ReAct loop with built-in tools. Strong on frontend/UI tasks. Multimodal input support. Generous free tier."
        highlight: "Gemini models · Free tier · Open source"
    more:
      - Kiro CLI
      - Qwen Code
      - OpenCode
      - Aider
      - Kilo Code
    more_urls:
      Kiro CLI: https://kiro.dev/
      Qwen Code: https://github.com/QwenLM/qwen-code
      OpenCode: https://github.com/opencode-ai/opencode
      Aider: https://aider.chat/
      Kilo Code: https://kilo.ai/

  - id: review
    label: AI Code Review
    title: "Automated PR Review"
    tagline: "AI reviewers that catch bugs before your teammates and customers do"
    audience: "Teams wanting faster, more consistent code review and fewer bugs in production"
    layout:
      grid_column: "1 / 3"
      grid_row: "4"
      tools_columns: 4
    colors:
      bg_gradient: ["#1a1710", "#1a1508"]
      border: "#38301e"
      accent: ["#f59e0b", "#d97706"]
      label: "#fbbf24"
      card_bg: "#201c10"
      card_hover_bg: "#282010"
    tools:
      - name: Claude Code Review
        url: https://code.claude.com/docs/en/code-review
        type: GitHub app
        desc: "Anthropic's code review agent. Multi-agent analysis on GitHub PRs via @claude mention or auto-assignment. Deep codebase context. Inline comments with severity levels and suggested fixes."
        highlight: "~$15–25/review avg · Teams & Enterprise · Claude models"
      - name: GitHub Copilot Code Review
        url: https://docs.github.com/en/copilot/using-github-copilot/code-review/using-copilot-code-review
        type: GitHub built-in
        desc: 'Native GitHub PR reviewer. Request review from "Copilot" like any teammate. Inline suggestions you can commit directly. Custom coding guidelines support.'
        highlight: "Included with Copilot sub · Deepest GitHub integration"
      - name: Cubic
        url: https://www.cubic.dev/
        type: GitHub app
        desc: "AI-native review platform. 2-click GitHub install. Learns your team's standards. Inline feedback in seconds, one-click fixes, intelligent diff ordering. Also does full codebase scans."
        highlight: "Free for open source · From $30/mo for teams · SOC 2 compliant"
      - name: CodeRabbit
        url: https://www.coderabbit.ai/
        type: GitHub/GitLab app
        desc: "Most-installed AI app on GitHub (3M+ repos). Line-by-line suggestions, 1-click fixes, codegraph analysis. GitHub, GitLab, Azure DevOps & Bitbucket."
        highlight: "Free for OSS · From $12/seat/mo Lite · $24/seat/mo Pro"
    more:
      - Greptile
      - Sourcery
      - Qodo Merge
    more_urls:
      Greptile: https://www.greptile.com/
      Sourcery: https://www.sourcery.ai/
      Qodo Merge: https://www.qodo.ai/

  - id: qa
    label: AI QA & Testing
    title: "Automated Testing"
    tagline: "AI that tests your app so you don't ship bugs"
    audience: "QA teams, developers wanting automated test coverage, teams scaling without dedicated QA"
    layout:
      grid_column: "1 / 3"
      grid_row: "5"
      tools_columns: 2
    colors:
      bg_gradient: ["#1a1a14", "#181810"]
      border: "#33382e"
      accent: ["#84cc16", "#65a30d"]
      label: "#a3e635"
      card_bg: "#1c2018"
      card_hover_bg: "#242820"
    tools:
      - name: Thunders
        url: https://www.thunders.ai/
        type: platform
        desc: "AI test automation platform. Natural language test creation, self-healing tests that adapt to UI changes. Web, mobile & API testing. AI personas for SEO, accessibility & security audits."
        highlight: "From €399/mo · CI/CD integration · Jira/Linear/Xray"
      - name: Mabl
        url: https://www.mabl.com/
        type: platform
        desc: "AI-native test automation (est. 2017). Agentic tester for web, mobile & API. Auto-healing tests, semantic search, failure triaging. Gartner-recognized, 5x AI Breakthrough Award winner."
        highlight: "Free trial · Enterprise pricing · Jira/GitHub/Slack integrations"
    more:
      - Momentic
      - QA Wolf
    more_urls:
      Momentic: https://www.momentic.ai/
      QA Wolf: https://www.qawolf.com/

  - id: always-on
    label: Always-On Agents
    title: "Personal AI That Runs 24/7"
    tagline: "AI that works while you sleep — scheduling, automating, and acting on your behalf"
    audience: "Personal automation, async workflows, always-available assistants"
    layout:
      grid_column: "1 / 3"
      grid_row: "6"
      tools_columns: 3
    colors:
      bg_gradient: ["#1a1418", "#18121a"]
      border: "#38232d"
      accent: ["#f472b6", "#db2777"]
      label: "#f9a8d4"
      card_bg: "#201420"
      card_hover_bg: "#281a28"
    tools:
      - name: OpenClaw
        url: https://github.com/openclaw/openclaw
        type: self-hosted
        desc: "Open-source personal agent (247K GitHub stars). Runs locally, connects via WhatsApp/Telegram/Discord/Signal. Heartbeat scheduler, persistent memory, self-installing skills."
      - name: Dreamer
        url: https://dreamer.com/
        type: platform
        desc: 'Agent platform by ex-Stripe CTO & Hugo Barra ($56M funded). "Sidekick" builds agents for you. Gallery to share/remix. Triggers, cron, memory. Team acqui-hired by Meta (March 2026).'
      - name: Nanobot
        url: https://github.com/nanobot-ai/nanobot
        type: self-hosted
        desc: "Open-source MCP agent platform built in Go. Web chat interface with Slack/SMS/email on roadmap. Multi-LLM support (OpenAI, Anthropic). YAML-configured agents. Auditable and minimal."
    infra_note:
      label: Honorable mentions
      text: >
        <strong><a href="https://claude.com/product/cowork" style="color:inherit; text-decoration:none;">Claude Cowork</a></strong> (scheduled remote agents with full tool access) and
        <strong><a href="https://copilot.microsoft.com" style="color:inherit; text-decoration:none;">Microsoft Copilot</a></strong> (scheduled actions, reminders, always-on assistant)
        overlap with this category. They're not purpose-built personal agents, but their scheduling and remote-access features are heading this direction.
