  - id: review
    label: AI Code Review
    title: "Automated PR Review"
    tagline: "AI reviewers that catch bugs before your teammates and customers do"
    audience: "Teams wanting faster, more consistent code review and fewer bugs in production"
    layout:
      grid_column: "1 / 3"
      grid_row: "4"
      tools_columns: 3
    colors:
      bg_gradient: ["#1a1710", "#1a1508"]
      border: "#38301e"
      accent: ["#f59e0b", "#d97706"]
      label: "#fbbf24"
      card_bg: "#201c10"
      card_hover_bg: "#282010"
    tools:
      - name: Claude Code Review
        url: https://code.claude.com/docs/en/code-review
        type: GitHub app
        desc: "Anthropic's code review agent. Multi-agent analysis on GitHub PRs via per-repo review settings or @claude review. Deep codebase context. Inline comments with severity levels and per-finding reasoning."
        highlight: "Research preview · Team & Enterprise only · ~$15–25/review via usage credits · Not available with Zero Data Retention"
      - name: GitHub Copilot Code Review
        url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review
        type: GitHub built-in
        desc: 'Native GitHub PR reviewer. Request review from "Copilot" like any teammate. Inline suggestions you can commit directly. Custom coding guidelines support.'
        highlight: "Native GitHub review flow · Suggested fixes · Org-level enablement available"
      - name: Cubic
        url: https://www.cubic.dev/
        type: GitHub app
        desc: "AI-native review platform. 2-click GitHub install. Learns your team's standards. Inline feedback in seconds, one-click fixes, intelligent diff ordering. Also does full codebase scans."
        highlight: "Free for OSS · $40/dev/mo Team · $99/dev/mo Pro · SOC 2 compliant"
      - name: CodeRabbit
        url: https://www.coderabbit.ai/
        type: GitHub/GitLab app
        desc: "Most-installed AI app on GitHub (6M+ repos, 17K+ customers). Line-by-line suggestions, 1-click fixes, codegraph analysis. PR + IDE + CLI review across GitHub, GitLab, Azure DevOps & Bitbucket. $143M Series C at $1.5B (Aug 2026)."
        highlight: "Free for OSS · $30/dev/mo Essentials · $60 Team · $90 Advanced · Enterprise"
      - name: Cursor Bugbot
        url: https://cursor.com/bugbot
        type: GitHub app
        desc: "Cursor's dedicated PR reviewer. Runs as a background check on GitHub PRs, flags logic bugs with a low false-positive rate, and hands fixes to the Cursor editor or a cloud agent. Customizable via Bugbot Rules. Used as a mandatory pre-merge check at Sentry, Discord, Rippling."
        highlight: "Usage-based (~$1–1.50/review) · Requires Cursor Teams · Owns Graphite"
      - name: Codex Code Review
        url: https://learn.chatgpt.com/docs/third-party/github
        type: GitHub app
        desc: "OpenAI's GitHub PR reviewer. Trigger with @codex review, or auto-review every new PR. Posts a standard GitHub review focused on serious issues. @codex security review (research preview) does a deeper vulnerability pass. Rules live in AGENTS.md."
        highlight: "Included with ChatGPT plans · @codex review · Security review (research preview)"
    more:
