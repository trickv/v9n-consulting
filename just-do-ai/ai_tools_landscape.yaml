  - id: orchestrators
    label: Orchestrators & Multi-Agent
    title: "Orchestrators & Multi-Agent Tools"
    tagline: "One agent is productive — a fleet of them is a different game"
    audience: "Engineers who already live in a single-agent CLI and want to run many in parallel, or hand off whole tickets"
    intro: >-
      Single-agent coders like Claude Code are productive; the next leap is running fleets of them.
      These tools sit <strong>above</strong> single-agent coders. Loosely mapped to the upper rungs of the
      <strong>Yegge AI-coding maturity model</strong>: at <strong>stages 6–7</strong> you drive a fleet through
      an interface and still review and merge the work; at <strong>stage 8 and beyond</strong> the system runs
      autonomously from spec to shipped app — the "Dark Factory." This category didn't exist 12 months ago and
      is consolidating fast — start with the OSS options before paying for anything.
    layout:
      grid_column: "1 / 3"
      grid_row: "7"
      tools_columns: 3
    colors:
      bg_gradient: ["#101a1c", "#0e1820"]
      border: "#1e3438"
      accent: ["#06b6d4", "#0891b2"]
      label: "#67e8f9"
      card_bg: "#142428"
      card_hover_bg: "#182c30"
    stages:
      - label: "Stage 6–7 · Multi-Agent Interfaces"
        desc: "You drive the fleet; you review and merge the work"
        tools:
          - name: Symphony
            url: https://github.com/openai/symphony
            license: {style: oss, text: "OSS · OpenAI"}
            desc: >-
              Polls a Linear board, auto-claims tickets, and spawns an isolated Codex session per issue — governed by an in-repo <code style="font-family:'JetBrains Mono',monospace;color:#9aa5a8;">WORKFLOW.md</code> policy file — then returns PRs with proof-of-work. ~15K stars in its first week.
          - name: Conductor
            url: https://www.conductor.build/
            license: {style: prop, text: "Proprietary"}
            desc: >-
              Polished Mac app (Melty Labs) for running parallel Claude Code + Codex agents in isolated git worktrees, with a central dashboard and inline diff review/merge. Apple Silicon.
          - name: Emdash
            url: https://github.com/generalaction/emdash
            license: {style: oss, text: "OSS · Apache-2.0"}
            desc: >-
              Cross-platform open-source agent dev environment (YC W26). Runs 20+ CLI agents (Claude Code, Codex, Gemini, Amp, Hermes…) in parallel worktrees — local or over SSH — with Linear/Jira/GitHub ticket integration.
          - name: Claude Squad
            url: https://github.com/smtg-ai/claude-squad
            license: {style: oss, text: "OSS · terminal"}
            desc: >-
              Terminal TUI that manages many agents — Claude Code, Codex, Gemini, Aider, OpenCode, Amp — each in its own tmux session and git worktree. The lightweight, terminal-native way to run a fleet.
          - name: Vibe Kanban
            url: https://github.com/BloopAI/vibe-kanban
            license: {style: oss, text: "OSS · community"}
            desc: >-
              Kanban board for agent tasks with isolated worktrees and multi-agent support. Company Bloop shut down April 2026; now community-maintained OSS (Apache-2.0) and fully local — try via <code style="font-family:'JetBrains Mono',monospace;color:#9aa5a8;">npx vibe-kanban</code>.
          - name: Composio AO
            url: https://github.com/ComposioHQ/agent-orchestrator
            license: {style: oss, text: "OSS · MIT"}
            desc: >-
              Agent-, runtime-, and tracker-agnostic orchestrator. Each agent gets its own worktree, branch, and PR; when CI fails the agent fixes it, and it answers review comments without per-edit approval.
        more_label: "And more:"
        more:
          - name: Sculptor
            url: https://imbue.com/sculptor
            note: "(Imbue — Docker-isolated Claude Code agents)"
          - name: Crystal
            url: https://github.com/stravu/crystal
            note: "(MIT, parallel Claude Code sessions)"
      - label: "Stage 8 & Beyond · Autonomous"
        desc: 'Spec in, app out — the "Dark Factory"'
        tools:
          - name: Gas Town
            url: https://github.com/gastownhall/gastown
            license: {style: oss, text: "OSS · Steve Yegge"}
            desc: >-
              Go-based orchestration running 20–30 parallel Claude Code agents across role-based "crews," paired with the Beads work-tracking primitive. Reached v1.0 in April 2026. Heavy sessions can run $100–200/hr in API costs.
          - name: Genie (Cosine)
            url: https://cosine.sh/product
            license: {style: prop, text: "Proprietary"}
            desc: >-
              Autonomous software engineer trained on real engineering decision traces. Air-gapped enterprise deployment and top-tier benchmarks (72% SWE-Lancer). Genie 2.0 is the current release.
          - name: Factory (Droids)
            url: https://factory.ai/
            license: {style: prop, text: "Proprietary"}
            desc: >-
              Enterprise agent-native development: autonomous "Droids" that own migrations, test generation, and modernization across legacy codebases. $150M Series C at $1.5B (2026); Fortune 500 deployments.
          - name: Blitzy
            url: https://blitzy.com/
            license: {style: prop, text: "Proprietary"}
            desc: >-
              Spec-to-app autonomous platform — thousands of agents cooperating for hours to build entire projects. The canonical "Dark Factory." $200M raise at $1.4B (2026). Buy, don't build.
