title: AI Engineering Tools Landscape
subtitle: "Coding with AI Bootcamp — reference"

footer_note: |
  These categories aren't walls — tools are converging fast. The best AI-assisted developers reach for different tools at different moments.
  This bootcamp focuses on <strong style="color:#f0a0a0;">Claude Code</strong> because understanding the terminal agent paradigm gives you the deepest foundation. Everything else is a layer of abstraction on top.

star_legend:
  - label: Bootcamp primary tool
    style: gold
  - label: Covered in bootcamp
    style: gray

categories:

  - id: generators
    label: Platform Builders
    title: "Prompt → App"
    tagline: "Describe it, get a working app — batteries included"
    audience: "Rapid prototypes, MVPs, non-technical builders, PM demos"
    layout:
      grid_column: "1"
      grid_row: "1 / 4"
    colors:
      bg_gradient: ["#1a1520", "#161220"]
      border: "#2d2338"
      accent: ["#a855f7", "#7c3aed"]
      label: "#c084fc"
      card_bg: "#1f1828"
      card_hover_bg: "#251e30"
    tools:
      - name: Lovable
        url: https://lovable.dev/
        type: browser
        star: gray
        desc: "Full-stack React/TS apps from prompts. Best-in-class UI quality. Lovable Cloud backend (built on Supabase) on by default, or bring your own Supabase. One-click deploy."
        highlight: "~$25/mo Pro (shared across unlimited users) · Credit-based · GitHub sync"
      - name: Google AI Studio
        url: https://aistudio.google.com/welcome
        type: browser
        desc: 'Free Gemini 3.5 access. "Build" mode for vibe coding apps, powered by the Antigravity agent. Deploy to Cloud Run or sync to GitHub. Web and native Android output. Text, image, audio & video models in one playground.'
        highlight: "Free tier · Google ecosystem · Gemini API keys"
      - name: Bolt
        url: https://bolt.new/
        type: browser
        desc: "By StackBlitz. AI builder for websites, apps, and prototypes with design-system support, built-in hosting, databases, auth, analytics, custom domains, and multiple model options."
        highlight: "Free tier · Pro $25/mo · Teams $30/user/mo · Built-in hosting/databases"
      - name: Replit
        url: https://replit.com/
        type: browser IDE
        desc: "Cloud IDE + Agent 4. Parallel agents, infinite canvas design, multiple artifacts. Auto-tests and auto-debugs. 50+ languages."
        highlight: "Credit-based · Core $20/mo · Pro $100/mo · Built-in DB, auth & hosting"
      - name: Emergent
        url: https://emergent.sh/
        type: browser
        desc: "Conversational full-stack builder — agents design, code, and deploy web and mobile apps end to end. One-click LLM integration, GitHub sync, custom agents on higher tiers. $70M raise (Jan 2026), ~$50M ARR, 6M+ users."
        highlight: "Free · $17/mo Standard · $167/mo Pro · Enterprise"
      - name: Figma Make
        url: https://www.figma.com/make/
        type: browser
        desc: "Figma's prompt-to-app tool. Turns a description or an existing Figma design into a working app, with a visual editor over the generated code and live testing. ~60% of Figma's largest customers use it weekly."
        highlight: "Included in Figma plans · Design-to-app · Visual code editing"
    more:
      - v0
      - Base44
      - Anything
      - Blitzy
      - Hostinger AI Builder
      - Tempo
      - Rocket.new
    more_urls:
      v0: https://v0.app/
      Base44: https://base44.com/
      Anything: https://www.anything.com/
      Blitzy: https://blitzy.com/
      Hostinger AI Builder: https://www.hostinger.com/ai-builder
      Tempo: https://www.tempo.new/
      Rocket.new: https://www.rocket.new/
    infra_note:
      label: Common infrastructure defaults
      text: >
        <strong>Supabase</strong> (Postgres DB, auth, storage) and <strong>Vercel</strong> (frontend deploy)
        show up as defaults in most platform builders — but they're not AI-specific.
        Netlify, Cloudflare Pages, Fly.io, Firebase, or whatever you already use works just as well.

  - id: ide
    label: AI-Native Editors
    title: "IDE + Agent"
    tagline: "Your editor, supercharged with AI agents"
    audience: "Day-to-day dev work, refactoring, feature builds — and devs who still want hands on the keyboard"
    layout:
      grid_column: "2"
      grid_row: "3"
    colors:
      bg_gradient: ["#141a20", "#121820"]
      border: "#1e2d38"
      accent: ["#3b82f6", "#2563eb"]
      label: "#60a5fa"
      card_bg: "#182028"
      card_hover_bg: "#1c2630"
    tools:
      - name: Cursor
        url: https://cursor.com/
        type: desktop IDE
        desc: "VS Code fork rebuilt around AI, now part of SpaceX (acquired Aug 2026). Indexes entire repos. Composer 2.5 for multi-file edits. Tab autocomplete. Bugbot PR review. Cloud agents. Multi-model incl. Grok 4.6."
        highlight: "$20/mo Pro · $60/mo Pro+ · $200/mo Ultra · $40/user/mo Teams · Also in JetBrains via ACP"
      - name: GitHub Copilot
        url: https://github.com/features/copilot
        type: IDE plugin
        desc: "Most widely adopted. Agent mode for autonomous edits. Coding Agent assigns issues → PRs. Assign tasks to Claude or Codex agents alongside Copilot's own. MCP + multi-model support."
        highlight: "Free · $10/mo Pro · $39/mo Pro+ · $100/mo Max · $19/user/mo Business · VS Code, JetBrains, Visual Studio, Xcode, Neovim, Eclipse"
      - name: Google Antigravity
        url: https://antigravity.google/
        type: desktop IDE + CLI
        desc: "Google's agent-first IDE. VS Code fork built around orchestrating parallel agents — Editor View plus a Manager Surface. Generates verifiable Artifacts (plans, screenshots, browser recordings). 2.0 adds CLI + SDK. Multi-model: Gemini 3.x, Claude Sonnet/Opus 4.6, gpt-oss."
        highlight: "Free tier (GA) · Gemini 3.x + Claude 4.6 multi-model · IDE + CLI + SDK · Paid via Google AI Pro/Ultra"
      - name: Kiro
        url: https://kiro.dev/
        type: desktop IDE + CLI
        desc: "AWS's spec-driven agentic IDE — turns a prompt into requirements, a design doc, and a task list that live in the repo, then implements against them. IDE + CLI + web + mobile, parallel agents. GA May 2026 as the replacement for Amazon Q Developer. Claude models via Bedrock."
        highlight: "Free tier · Credit-based paid tiers · IDE + CLI + web · Claude via Bedrock"
    more:
      - Devin Desktop (formerly Windsurf)
      - JetBrains AI
      - Zed AI
      - Trae
    more_urls:
      Devin Desktop (formerly Windsurf): https://devin.ai/desktop
      JetBrains AI: https://www.jetbrains.com/ai/
      Zed AI: https://zed.dev/
      Trae: https://www.trae.ai/

  - id: terminal
    label: Agentic Coding
    title: "Agent-First"
    tagline: "Skip the editor — talk directly to the agent"
    audience: "Production codebases, deep refactoring, experienced engineers"
    badge:
      text: Bootcamp Focus
      style: primary
    layout:
      grid_column: "2"
      grid_row: "1 / 3"
    colors:
      bg_gradient: ["#141f1a", "#121a16"]
      border: "#1e382d"
      accent: ["#22c55e", "#16a34a"]
      label: "#4ade80"
      card_bg: "#182820"
      card_hover_bg: "#1c3028"
    tools:
      - name: Claude Code
        url: https://code.claude.com/docs/en/overview
        type: CLI + Desktop + Web + IDE
        star: gold
        desc: "Anthropic's leading agent. Deep codebase understanding via large context. Git-aware. Skills/MCP extensible. Transparent operation. Same engine in terminal, IDE, desktop app, and browser — shared CLAUDE.md, settings, and MCP config."
        highlight: "Claude Fable/Opus/Sonnet · Included in Pro $20/mo, Max $100–200/mo · Configurable approval modes · Local-first"
      - name: Codex
        url: https://github.com/openai/codex
        type: CLI + App
        desc: "OpenAI's agent. Open-source, Rust-built. Multi-agent workflows (fork sub-tasks). Skills system. Cloud mode for async work. Desktop app + CLI + IDE."
        highlight: "GPT-5.6 Sol/Terra/Luna · Included in ChatGPT Plus $20/mo, Pro $200/mo · Web search built in · Plugin/MCP ecosystem"
      - name: Gemini CLI
        url: https://github.com/google-gemini/gemini-cli
        type: CLI
        desc: "Google's terminal agent. ReAct loop with built-in tools. Strong on frontend/UI tasks. Multimodal input support. Generous free tier."
        highlight: "Gemini 3 Pro/Flash · Free tier (1,000 req/day) · Apache 2.0"
      - name: OpenCode
        url: https://opencode.ai/
        type: CLI + IDE + Desktop
        desc: "Open-source, model-agnostic terminal agent. 75+ LLM providers including local models, plus direct Claude/GPT/Gemini/Copilot sign-in. The answer to \"what if I don't want to pick a vendor.\" ~195K GitHub stars."
        highlight: "Free · 75+ model providers incl. local · Optional Zen curated-model tier · Open source"
