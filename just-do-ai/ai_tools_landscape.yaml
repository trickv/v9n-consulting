title: AI Engineering Tools Landscape
subtitle: "Coding with AI Bootcamp — reference"

footer_note: |
  These categories aren't walls — tools are converging fast. The best AI-assisted developers reach for different tools at different moments.
  This bootcamp focuses on <strong style="color:#f0a0a0;">Claude Code</strong> because understanding the terminal agent paradigm gives you the deepest foundation. Everything else is a layer of abstraction on top.

star_legend:
  - label: Bootcamp primary tool
    style: gold
  - label: Covered in bootcamp
    style: gray

categories:

  - id: generators
    label: Platform Builders
    title: "Prompt → App"
    tagline: "Describe it, get a working app — batteries included"
    audience: "Rapid prototypes, MVPs, non-technical builders, PM demos"
    layout:
      grid_column: "1"
      grid_row: "1 / 4"
    colors:
      bg_gradient: ["#1a1520", "#161220"]
      border: "#2d2338"
      accent: ["#a855f7", "#7c3aed"]
      label: "#c084fc"
      card_bg: "#1f1828"
      card_hover_bg: "#251e30"
    tools:
      - name: Lovable
        url: https://lovable.dev/
        type: browser
        star: gray
        desc: "Full-stack React/TS apps from prompts. Best-in-class UI quality. Native Supabase integration. One-click deploy."
        highlight: "~$25/mo Pro (shared across unlimited users) · Credit-based · GitHub sync"
      - name: Google AI Studio
        url: https://aistudio.google.com/welcome
        type: browser
        desc: 'Free Gemini 3 access. "Build" mode for vibe coding apps. One-click deploy. Text, image, audio & video models in one playground.'
        highlight: "Free tier · Google ecosystem · Gemini API keys"
      - name: Bolt
        url: https://bolt.new/
        type: browser
        desc: "By StackBlitz. AI builder for websites, apps, and prototypes with design-system support, built-in hosting, databases, auth, analytics, custom domains, and multiple model options."
        highlight: "Free tier · Pro $25/mo · Teams $30/user/mo · Built-in hosting/databases"
      - name: Replit
        url: https://replit.com/
        type: browser IDE
        desc: "Cloud IDE + Agent 4. Parallel agents, infinite canvas design, multiple artifacts. Auto-tests and auto-debugs. 50+ languages."
        highlight: "Credit-based · Core $20/mo & Pro $95/mo (billed annually) · Built-in DB, auth & hosting"
    more:
      - v0
      - Base44
      - Anything
      - Blitzy
      - Hostinger Horizons
      - Tempo
    more_urls:
      v0: https://v0.app/
      Base44: https://base44.com/
      Anything: https://www.create.xyz/
      Blitzy: https://blitzy.com/
      Hostinger Horizons: https://www.hostinger.com/horizons
      Tempo: https://www.tempo.new/
    infra_note:
      label: Common infrastructure defaults
      text: >
        <strong>Supabase</strong> (Postgres DB, auth, storage) and <strong>Vercel</strong> (frontend deploy)
        show up as defaults in most platform builders — but they're not AI-specific.
        Netlify, Cloudflare Pages, Fly.io, Firebase, or whatever you already use works just as well.

  - id: ide
    label: AI-Native Editors
    title: "IDE + Agent"
    tagline: "Your editor, supercharged with AI agents"
    audience: "Day-to-day dev work, refactoring, feature builds — and devs who still want hands on the keyboard"
    layout:
      grid_column: "2"
      grid_row: "3"
    colors:
      bg_gradient: ["#141a20", "#121820"]
      border: "#1e2d38"
      accent: ["#3b82f6", "#2563eb"]
      label: "#60a5fa"
      card_bg: "#182028"
      card_hover_bg: "#1c2630"
    tools:
      - name: Cursor
        url: https://cursor.com/
        type: desktop IDE
        desc: "VS Code fork rebuilt around AI. Indexes entire repos. Composer 2.5 for multi-file edits. Tab autocomplete model. BugBot PR review. Background agents. Multi-model."
        highlight: "$20/mo Pro · $60/mo Pro+ · $200/mo Ultra · $40/user/mo Teams · Also in JetBrains via ACP"
      - name: GitHub Copilot
        url: https://github.com/features/copilot
        type: IDE plugin
        desc: "Most widely adopted. Agent mode for autonomous edits. Coding Agent assigns issues → PRs. MCP + multi-model support."
        highlight: "VS Code, JetBrains, Visual Studio, Xcode · Plan/Agent/Edit modes"
      - name: Google Antigravity
        url: https://antigravity.google/
        type: desktop IDE + CLI
        desc: "Google's agent-first IDE. VS Code fork built around orchestrating parallel agents — Editor View plus a Manager Surface. Generates verifiable Artifacts (plans, screenshots, browser recordings). 2.0 adds CLI + SDK. Powered by Gemini 3."
        highlight: "Free for individuals (public preview) · Gemini 3 · IDE + CLI + SDK"
    more:
      - Windsurf
      - JetBrains AI
      - Zed AI
      - Trae
      - Void (development paused)
    more_urls:
      Windsurf: https://windsurf.com/
      JetBrains AI: https://www.jetbrains.com/ai/
      Zed AI: https://zed.dev/
      Trae: https://www.trae.ai/
      Void (development paused): https://voideditor.com/

  - id: terminal
    label: Agentic Coding
    title: "Agent-First"
    tagline: "Skip the editor — talk directly to the agent"
    audience: "Production codebases, deep refactoring, experienced engineers"
    badge:
      text: Bootcamp Focus
      style: primary
    layout:
      grid_column: "2"
      grid_row: "1 / 3"
    colors:
      bg_gradient: ["#141f1a", "#121a16"]
      border: "#1e382d"
      accent: ["#22c55e", "#16a34a"]
      label: "#4ade80"
      card_bg: "#182820"
      card_hover_bg: "#1c3028"
    tools:
      - name: Claude Code
        url: https://code.claude.com/docs/en/overview
        type: CLI + App
        star: gold
        desc: "Anthropic's leading agent. Deep codebase understanding via large context. Git-aware. Skills/MCP extensible. Transparent operation."
        highlight: "Claude Sonnet/Opus · Configurable approval modes · Local-first"
      - name: Codex
        url: https://github.com/openai/codex
        type: CLI + App
        desc: "OpenAI's agent. Open-source, Rust-built. Multi-agent workflows (fork sub-tasks). Skills system. Cloud mode for async work. Desktop app + CLI + IDE."
        highlight: "GPT-5.x · Web search built in · Plugin/MCP ecosystem"
      - name: Gemini CLI
        url: https://github.com/google-gemini/gemini-cli
        type: CLI
        desc: "Google's terminal agent. ReAct loop with built-in tools. Strong on frontend/UI tasks. Multimodal input support. Generous free tier."
        highlight: "Gemini models · Free tier · Open source"
    more:
      - Kiro CLI
      - Qwen Code
      - Crush
      - Devin
      - Junie CLI
      - Aider
      - Kilo Code
      - Cline
      - Warp
    more_urls:
      Kiro CLI: https://kiro.dev/
      Qwen Code: https://github.com/QwenLM/qwen-code
      Crush: https://github.com/charmbracelet/crush
      Devin: https://devin.ai/
      Junie CLI: https://github.com/JetBrains/junie
      Aider: https://aider.chat/
      Kilo Code: https://kilo.ai/
      Cline: https://cline.bot/
      Warp: https://www.warp.dev/

  - id: review
    label: AI Code Review
    title: "Automated PR Review"
    tagline: "AI reviewers that catch bugs before your teammates and customers do"
    audience: "Teams wanting faster, more consistent code review and fewer bugs in production"
    layout:
      grid_column: "1 / 3"
      grid_row: "4"
      tools_columns: 4
    colors:
      bg_gradient: ["#1a1710", "#1a1508"]
      border: "#38301e"
      accent: ["#f59e0b", "#d97706"]
      label: "#fbbf24"
      card_bg: "#201c10"
      card_hover_bg: "#282010"
    tools:
      - name: Claude Code Review
        url: https://code.claude.com/docs/en/code-review
        type: GitHub app
        desc: "Anthropic's code review agent. Multi-agent analysis on GitHub PRs via @claude mention or auto-assignment. Deep codebase context. Inline comments with severity levels and suggested fixes."
        highlight: "Research preview · Team & Enterprise only · Not available with Zero Data Retention"
      - name: GitHub Copilot Code Review
        url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review
        type: GitHub built-in
        desc: 'Native GitHub PR reviewer. Request review from "Copilot" like any teammate. Inline suggestions you can commit directly. Custom coding guidelines support.'
        highlight: "Native GitHub review flow · Suggested fixes · Org-level enablement available"
      - name: Cubic
        url: https://www.cubic.dev/
        type: GitHub app
        desc: "AI-native review platform. 2-click GitHub install. Learns your team's standards. Inline feedback in seconds, one-click fixes, intelligent diff ordering. Also does full codebase scans."
        highlight: "Free for OSS · $40/dev/mo Team · $99/dev/mo Pro · SOC 2 compliant"
      - name: CodeRabbit
        url: https://www.coderabbit.ai/
        type: GitHub/GitLab app
        desc: "Most-installed AI app on GitHub (3M+ repos, 15K+ customers). Line-by-line suggestions, 1-click fixes, codegraph analysis. PR + IDE + CLI review across GitHub, GitLab, Azure DevOps & Bitbucket."
        highlight: "Free for OSS · $30/seat/mo Pro · Enterprise"
    more:
      - Devin Review
      - Greptile
      - Sourcery
      - Qodo Merge
      - Graphite AI Reviews
    more_urls:
      Devin Review: https://app.devin.ai/review
      Greptile: https://www.greptile.com/
      Sourcery: https://www.sourcery.ai/
      Qodo Merge: https://www.qodo.ai/
      Graphite AI Reviews: https://graphite.com/features/ai-reviews

