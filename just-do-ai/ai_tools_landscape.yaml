title: AI Coding Tools Landscape
subtitle: "Coding with AI Bootcamp — Session 1 Reference"

footer_note: |
  These categories aren't walls — tools are converging fast. The best AI-assisted developers reach for different tools at different moments.
  This bootcamp focuses on <strong style="color:#f0a0a0;">Claude Code</strong> because understanding the terminal agent paradigm gives you the deepest foundation. Everything else is a layer of abstraction on top.

star_legend:
  - label: Bootcamp primary tool
    style: gold
  - label: Covered in bootcamp
    style: gray

categories:

  - id: generators
    label: App Generators
    title: "Prompt → App"
    tagline: "Describe it, get a working app"
    audience: "Rapid prototypes, MVPs, non-technical builders, PM demos"
    layout:
      grid_column: "1"
      grid_row: "1 / 4"
    colors:
      bg_gradient: ["#1a1520", "#161220"]
      border: "#2d2338"
      accent: ["#a855f7", "#7c3aed"]
      label: "#c084fc"
      card_bg: "#1f1828"
      card_hover_bg: "#251e30"
    tools:
      - name: Lovable
        url: https://lovable.dev/
        type: browser
        star: gray
        desc: "Full-stack React/TS apps from prompts. Best-in-class UI quality. Native Supabase integration. One-click deploy."
        highlight: "~$20/mo · Credit-based · GitHub sync"
      - name: Google AI Studio
        url: https://aistudio.google.com/
        type: browser
        desc: 'Free Gemini 3 access. "Build" mode for vibe coding apps. Firebase Studio for full-stack deployment. Best for AI-powered prototypes.'
        highlight: "Free tier · Google ecosystem · Less mature as app builder"
      - name: Bolt
        url: https://bolt.new/
        type: browser
        desc: "By StackBlitz. Full Node.js in-browser via WebContainers. React/Vite output. Multiple AI model support."
        highlight: "Token-based · Netlify/Vercel deploy · Open source"
      - name: Replit
        url: https://replit.com/
        type: browser IDE
        desc: "Cloud IDE + Agent 3. Most autonomous — runs 200 min unattended, self-tests, auto-debugs. 50+ languages. Mobile app support."
        highlight: "Checkpoint pricing · Built-in DB & auth · Also a full IDE"
    more:
      - v0
      - Base44
      - Create.xyz
      - Hostinger Horizons
    more_urls:
      v0: https://v0.dev/
      Base44: https://base44.com/
      Create.xyz: https://create.xyz/
      Hostinger Horizons: https://www.hostinger.com/horizons
    infra_note:
      label: Common infrastructure defaults
      text: >
        <strong>Supabase</strong> (Postgres DB, auth, storage) and <strong>Vercel</strong> (frontend deploy)
        show up as defaults in most app generators — but they're not AI-specific.
        Netlify, Cloudflare Pages, Fly.io, Firebase, or whatever you already use works just as well.

  - id: ide
    label: AI-Native Editors
    title: "IDE + Agent"
    tagline: "Tab autocomplete AI — and growing to be more agentic"
    audience: "Day-to-day dev work, refactoring, feature builds, code review"
    layout:
      grid_column: "2"
      grid_row: "1"
    colors:
      bg_gradient: ["#141a20", "#121820"]
      border: "#1e2d38"
      accent: ["#3b82f6", "#2563eb"]
      label: "#60a5fa"
      card_bg: "#182028"
      card_hover_bg: "#1c2630"
    tools:
      - name: Cursor
        url: https://cursor.com/
        type: desktop IDE
        desc: "VS Code fork rebuilt around AI. Indexes entire repos. Composer for multi-file edits. Background agents on branches. Multi-model."
        highlight: "~$20/mo Pro · Also in JetBrains via ACP"
      - name: GitHub Copilot
        url: https://github.com/features/copilot
        type: IDE plugin
        desc: "Most widely adopted. Agent mode for autonomous edits. Coding Agent assigns issues → PRs. MCP + multi-model support."
        highlight: "VS Code, JetBrains, Visual Studio, Xcode · Plan/Agent/Edit modes"
    more:
      - Windsurf
      - JetBrains AI
      - Zed AI
      - Trae
    more_urls:
      Windsurf: https://windsurf.com/
      JetBrains AI: https://www.jetbrains.com/ai/
      Zed AI: https://zed.dev/
      Trae: https://trae.ai/

  - id: terminal
    label: Agentic Coding
    title: "CLI + Agent"
    tagline: "Agentic-first experience"
    audience: "Production codebases, deep refactoring, experienced engineers"
    badge:
      text: Bootcamp Focus
      style: primary
    layout:
      grid_column: "2"
      grid_row: "2 / 4"
    colors:
      bg_gradient: ["#141f1a", "#121a16"]
      border: "#1e382d"
      accent: ["#22c55e", "#16a34a"]
      label: "#4ade80"
      card_bg: "#182820"
      card_hover_bg: "#1c3028"
    tools:
      - name: Claude Code
        url: https://docs.anthropic.com/en/docs/claude-code
        type: CLI + App
        star: gold
        desc: "Anthropic's leading agent. Deep codebase understanding via large context. Git-aware. Skills/MCP extensible. Transparent operation."
        highlight: "Claude Sonnet/Opus · Configurable approval modes · Local-first"
      - name: Codex
        url: https://github.com/openai/codex
        type: CLI + App
        desc: "OpenAI's agent. Open-source, Rust-built. Multi-agent workflows (fork sub-tasks). Skills system. Cloud mode for async work. Desktop app + CLI + IDE."
        highlight: "GPT-5.x · Web search built in · Plugin/MCP ecosystem"
      - name: Gemini CLI
        url: https://github.com/google-gemini/gemini-cli
        type: CLI
        desc: "Google's terminal agent. ReAct loop with built-in tools. Strong on frontend/UI tasks. Multimodal input support. Generous free tier."
        highlight: "Gemini models · Free tier · Open source"
    more:
      - Qwen Code
      - OpenCode
      - Aider
      - Kilo Code
    more_urls:
      Qwen Code: https://github.com/QwenLM/qwen-code
      OpenCode: https://github.com/nicepkg/opencode
      Aider: https://aider.chat/
      Kilo Code: https://kilocode.ai/

  - id: review
    label: AI Code Review
    title: "Automated PR Review"
    tagline: "AI reviewers that catch bugs before your teammates do"
    audience: "Teams wanting faster, more consistent code review and fewer bugs in production"
    layout:
      grid_column: "1 / 3"
      grid_row: "4"
      tools_columns: 3
    colors:
      bg_gradient: ["#1a1710", "#1a1508"]
      border: "#38301e"
      accent: ["#f59e0b", "#d97706"]
      label: "#fbbf24"
      card_bg: "#201c10"
      card_hover_bg: "#282010"
    tools:
      - name: Claude Code Review
        url: https://docs.anthropic.com/en/docs/claude-code/code-review
        type: GitHub app
        desc: "Anthropic's code review agent. Runs on GitHub PRs via @claude mention or auto-assignment. Deep understanding of codebase context. Inline comments with suggested fixes."
        highlight: "Free during beta · GitHub integration · Claude models"
      - name: GitHub Copilot Code Review
        url: https://docs.github.com/en/copilot/using-github-copilot/code-review/using-copilot-code-review
        type: GitHub built-in
        desc: 'Native GitHub PR reviewer. Request review from "Copilot" like any teammate. Inline suggestions you can commit directly. Custom coding guidelines support.'
        highlight: "Included with Copilot sub · Deepest GitHub integration"
      - name: Cubic
        url: https://www.cubic.dev/
        type: GitHub app
        desc: "AI-native review platform. 2-click GitHub install. Learns your team's standards. Inline feedback in seconds, one-click fixes, intelligent diff ordering. Also does full codebase scans."
        highlight: "Free for open source · From $30/mo for teams · SOC 2 compliant"

  - id: always-on
    label: Always-On Agents
    title: "Personal AI That Runs 24/7"
    tagline: "AI that works while you sleep — scheduling, automating, and acting on your behalf"
    audience: "Personal automation, async workflows, always-available assistants"
    layout:
      grid_column: "1 / 3"
      grid_row: "5"
      tools_columns: 3
    colors:
      bg_gradient: ["#1a1418", "#18121a"]
      border: "#38232d"
      accent: ["#f472b6", "#db2777"]
      label: "#f9a8d4"
      card_bg: "#201420"
      card_hover_bg: "#281a28"
    tools:
      - name: OpenClaw
        url: https://github.com/open-claw/open-claw
        type: self-hosted
        desc: "Open-source personal agent (247K GitHub stars). Runs locally, connects via WhatsApp/Telegram/Discord. Heartbeat scheduler, persistent memory, self-installing skills."
      - name: Dreamer
        url: https://dreamer.com/
        type: platform
        desc: 'Agent platform by ex-Stripe CTO & Hugo Barra ($50M funded). "Sidekick" builds agents for you. Gallery to share/remix. Triggers, cron, memory. Anthropic partnership.'
      - name: Nanobot
        url: https://github.com/nanobot-ai/nanobot
        type: self-hosted
        desc: "Lightweight OpenClaw alternative (~4K lines Python). 8+ messaging platforms. Broader Asia-Pacific model support. Auditable and minimal."
